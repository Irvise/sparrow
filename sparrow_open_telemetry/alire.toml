name = "sparrow_open_telemetry"
description = "Sparrow web stack: trace export to OpenTelemetry collectors"
version = "1.0.0"

authors = ["Michael Hardeman"]
maintainers = ["Michael Hardeman <michael.hardeman@protonmail.com>"]
maintainers-logins = ["michael-hardeman"]
licenses = "MIT"
website = "https://github.com/michael-hardeman/sparrow"
tags = ["opentelemetry", "otlp", "tracing", "http"]

[available.'case(os)']
linux = true
macos = true
windows = true
freebsd = true
"..." = false

[build-switches]
"*".ada_version = "ada2022"
"*".style_checks = ["-gnatyM120"]

[[depends-on]]
sparrow_core = "~1.0.0"
sparrow_io = "~1.0.0"
sparrow_json = "~1.0.0"
sparrow_http = "~1.0.0"
sparrow_client = "~1.0.0"

# For development, siblings are taken from this repository.
[[pins]]
sparrow_core = { path = "../sparrow_core" }
sparrow_io = { path = "../sparrow_io" }
sparrow_crypto = { path = "../sparrow_crypto" }
sparrow_json = { path = "../sparrow_json" }
sparrow_http = { path = "../sparrow_http" }
sparrow_client = { path = "../sparrow_client" }

[[depends-on]]
gnat = ">=13"   # tested in CI with GNAT 13 to 16
