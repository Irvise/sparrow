name = "sparrow_crypto"
description = "Sparrow web stack: hashes, AEAD, Argon2id, Ed25519 and TLS over OpenSSL"
version = "0.1.0-dev"

authors = ["Michael Hardeman"]
maintainers = ["Michael Hardeman <michael.hardeman@protonmail.com>"]
maintainers-logins = ["michael-hardeman"]
licenses = "MIT"
website = "https://github.com/michael-hardeman/sparrow"
tags = ["openssl", "tls", "argon2", "hmac", "cryptography"]

[available.'case(os)']
linux = true
macos = true
windows = true
freebsd = true
"..." = false

[build-switches]
"*".ada_version = "ada2022"
"*".style_checks = ["-gnatyM120"]

[[depends-on]]
sparrow_core = "~0.1.0-dev"
openssl = "*"   # 3.0 or later; Argon2id needs 3.2, scrypt is used before it

# Until the crates are published, siblings are taken from this repository.
[[pins]]
sparrow_core = { path = "../sparrow_core" }

[[depends-on]]
gnat = ">=13"   # tested in CI with GNAT 13 to 16
